version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/financial_db
    depends_on:
      - mongodb
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 1024M

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    deploy: 
      resources:
        limits:
          cpus: '4.0'
          memory: 2048M

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data: 
